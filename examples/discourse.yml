# The caller that runs @discoursebot on davidtaylorhq/discourse.
name: Discoursebot

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    # Without this every comment in the repository starts a runner. The
    # backport bot answers to the same name and is not this one.
    if: |
      contains(github.event.comment.body, '@discoursebot') &&
      !contains(github.event.comment.body, '@discoursebot backport')
    uses: davidtaylorhq/quartermaster-agent/.github/workflows/quartermaster.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      mention: '@discoursebot'
    secrets:
      provider-env: |
        CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
