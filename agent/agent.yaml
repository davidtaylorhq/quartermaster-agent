name: workflow-agent
description: "Answers GitHub comments, reviews code, and authors changes"
time_grounding: true
agents_md: "false"
skills: "all"

tools:
  enabled: [update_plan]
  custom:
    - name: workspace_shell
      description: "Run a shell command in the workspace sandbox. Use dev <environment> <command> for development runtimes. Returns stdout, stderr and exit status."
      script: scripts/workspace-shell
      call: positional
      timeout_seconds: 660
      input:
        type: object
        properties:
          command:
            type: string
            description: "Bash command to execute in /src, with a ten-minute deadline. Use cd to change directories or timeout for a shorter deadline."
        required: [command]
        additionalProperties: false

mcp:
  - name: github
  - name: workspace

# The run ends when this is called, and only then. Nothing the agent does
# reaches GitHub on its own: line comments are held, this is the single reply,
# and the runner posts both together, once.
output_tool:
  name: finish
  description: "Finish the run. Call once, when there is nothing left to do."
  schema:
    type: object
    properties:
      reply:
        type: string
        description: "Markdown posted as your reply. Always say something, even after leaving line comments."
    required: [reply]
    additionalProperties: false

on_complete: |
  cat > "${OUTPUT_DIR:?}/finish.json"

max_turns: 60
handover_mode: "light"
