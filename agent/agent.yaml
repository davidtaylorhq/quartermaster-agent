name: workflow-agent
description: "Answers GitHub comments, reviews code, and authors changes"
time_grounding: true
agents_md: "false"
skills: "all"

tools:
  enabled: [update_plan]
  custom:
    - name: workspace_shell
      description: "Run a shell command in the workspace sandbox. Use dev <environment> <command> for development runtimes. Returns stdout, stderr and exit status."
      script: scripts/workspace-shell
      call: positional
      timeout_seconds: 660
      input:
        type: object
        properties:
          command:
            type: string
            description: "Bash command to execute in /src, with a ten-minute deadline. Use cd to change directories or timeout for a shorter deadline."
        required: [command]
        additionalProperties: false
    - name: open_pull_request
      description: "Open a PR for an allowed branch already pushed to this repository, or return its existing open PR. Publishes immediately. Does not merge."
      script: scripts/open-pull-request
      call: json
      input:
        type: object
        properties:
          head:
            type: string
          base:
            type: string
          title:
            type: string
          body:
            type: string
        required: [head, base, title, body]
        additionalProperties: false

mcp:
  - name: github
  - name: workspace

# The runner publishes the final reply and collected line comments together.
output_tool:
  name: finish
  description: "Finish the run. Call once, when there is nothing left to do."
  schema:
    type: object
    properties:
      reply:
        type: string
        description: "Markdown posted as your reply. Always say something, even after leaving line comments."
    required: [reply]
    additionalProperties: false

on_complete: |
  cat > "${OUTPUT_DIR:?}/finish.json"

max_turns: 60
handover_mode: "light"
