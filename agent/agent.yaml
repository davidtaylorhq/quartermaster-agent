name: workflow-agent
description: "Answers GitHub comments, reviews code, and authors changes"
time_grounding: true
agents_md: "false"
skills: "all"

tools:
  enabled: [update_plan]
  custom:
    - name: upload_image
      description: "Upload a workspace PNG image or WebM video to the configured GitHub attachments repository. Returns a URL for your final reply or line comment. Embed PNGs with Markdown image syntax; put video URLs on their own line. Uploads immediately; requires caller configuration."
      script: scripts/upload-image
      timeout_seconds: 120
      call: json
      input:
        type: object
        properties:
          path:
            type: string
            description: "PNG or WebM path in the workspace, absolute under /src or relative to /src. Maximum 10 MiB."
        required: [path]
        additionalProperties: false
    - name: line_comment
      description: "Attach a finding to a changed line of the PR. Collected and published with the final reply when you finish."
      script: scripts/line-comment.sh
      call: json
      input:
        type: object
        properties:
          path:
            type: string
            description: "File path as it appears in the PR diff."
          line:
            type: integer
            description: "Line number in the file after the change. Must be touched by the PR diff."
          body:
            type: string
            description: "Markdown finding. Use a fenced suggestion block for replacement code."
        required: [path, line, body]
        additionalProperties: false
    - name: open_pull_request
      description: "Open a PR for an allowed branch already pushed to this repository, or return its existing open PR. Publishes immediately. Does not merge."
      script: scripts/open-pull-request
      call: json
      input:
        type: object
        properties:
          head:
            type: string
          base:
            type: string
          title:
            type: string
          body:
            type: string
        required: [head, base, title, body]
        additionalProperties: false

mcp:
  - name: github
  - name: workspace

# The runner publishes the final reply and collected line comments together.
output_tool:
  name: finish
  description: "Finish the run. Call once, when there is nothing left to do."
  schema:
    type: object
    properties:
      reply:
        type: string
        description: "Markdown posted as your reply. Always say something, even after leaving line comments."
    required: [reply]
    additionalProperties: false

on_complete: |
  cat > "${OUTPUT_DIR:?}/finish.json"

max_turns: 60
handover_mode: "light"
