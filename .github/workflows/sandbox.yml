name: Sandbox image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/build-push-action@v6
        with:
          context: sandbox
          load: true
          tags: workflow-agent-smoke
      - name: Exercise container boundaries before publishing
        timeout-minutes: 5
        run: test/docker-smoke
      - name: Publish the tested runtime
        env:
          IMAGE: ghcr.io/${{ github.repository }}/sandbox
          REVISION: ${{ github.sha }}
        run: |
          docker tag workflow-agent-smoke "$IMAGE:$REVISION"
          docker tag workflow-agent-smoke "$IMAGE:latest"
          docker push "$IMAGE:$REVISION"
          docker push "$IMAGE:latest"
