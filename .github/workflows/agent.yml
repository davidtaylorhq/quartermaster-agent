name: Workflow Agent

on:
  workflow_call:
    inputs:
      mention:
        description: "What people type to summon the agent, including the @."
        required: true
        type: string
      bot-name:
        description: "Name on the agent's commits. Defaults to the mention without its @."
        type: string
        default: ""
      bot-login:
        description: "Login the agent's own comments are posted under."
        type: string
        default: "github-actions[bot]"
      provider:
        description: >-
          Passed to term-llm as `--provider`, so it takes the same forms:
          a provider name, or `name:model`. Leave it unset to use the
          `default_provider` in your own term-llm configuration. Left unset,
          term-llm chooses from the credentials it was given.
        type: string
        default: ""
      term-llm-config:
        description: >-
          Path in this repository to a term-llm configuration for the agent to
          use. Needed for a self-hosted or OpenAI-compatible endpoint, and for
          anything an environment variable cannot express.
        type: string
        default: ""
      environments:
        description: >-
          Path in this repository to the development environments the agent may
          run commands in. Without this file the agent reads, writes and
          answers using the workspace tools, without a development runtime.
        type: string
        default: .github/workflow-agent/environments.yml
      trusted-associations:
        description: "Who may instruct the agent, as GitHub author associations."
        type: string
        default: "OWNER,MEMBER,COLLABORATOR"
      followup-window:
        description: "Seconds the sandbox is held open after replying, for a follow-up."
        type: number
        default: 60
      max-comment-age-hours:
        description: "Mentions older than this are left alone, so a backlog is never answered at once."
        type: number
        default: 1
      max-turns:
        type: number
        default: 60
      agent-timeout:
        type: string
        default: "10m"
      runs-on:
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        type: number
        default: 45
    secrets:
      app-id:
        description: >-
          A GitHub App to act as, instead of Actions' own identity. Its
          comments carry the app's name, and its pushes start CI, which a push
          from `GITHUB_TOKEN` does not. Needs write on issues, pull requests
          and contents, plus read on actions, checks and statuses.
        required: false
      app-private-key:
        required: false
      provider-env:
        description: >-
          Lines of `NAME=value` giving the agent's provider what it needs to
          reach a model. Compose it from your own secrets.
        required: true

jobs:
  respond:
    # The same question `claim` asks, asked before anything boots.
    # Keep the two in step.
    if: >-
      contains(github.event.comment.body, inputs.mention) &&
      contains(
        format(',{0},', inputs.trusted-associations),
        format(',{0},', github.event.comment.author_association)
      )
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      # Queued rather than cancelled. Cancelling would kill a run waiting for
      # a follow-up with the very run that follow-up started, and a queued run
      # always finds the reaction the last one left.
      group: ${{ inputs.mention }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write  # the relay forwards the agent's commits; its hooks gate the branch
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read

    env:
      MENTION: ${{ inputs.mention }}
      TRUSTED_ASSOCIATIONS: ${{ inputs.trusted-associations }}
      FOLLOWUP_WINDOW: ${{ inputs.followup-window }}
      MAX_COMMENT_AGE_HOURS: ${{ inputs.max-comment-age-hours }}
      MAX_TURNS: ${{ inputs.max-turns }}
      AGENT_TIMEOUT: ${{ inputs.agent-timeout }}
      PROGRESS_SCRIPT: ${{ github.workspace }}/workflow-agent/bin/progress.ts
      PROVIDER: ${{ inputs.provider }}
      AGENT_DIR: ${{ github.workspace }}/workflow-agent/agent
      FORWARD_SCRIPT: ${{ github.workspace }}/workflow-agent/bin/git-forward.ts
      TERM_LLM_CONFIG: ${{ inputs.term-llm-config && format('{0}/project/{1}', github.workspace, inputs.term-llm-config) || '' }}
      GITHUB_TOOLSETS: pull_requests,issues,actions
      HAS_APP: ${{ secrets.app-id != '' }}
      CLAIMED: ${{ github.event.comment.id }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      IS_PULL_REQUEST: ${{ github.event.issue.pull_request && 'yes' || 'no' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Take the app's identity
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
      - name: Settle who is speaking
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FALLBACK_LOGIN: ${{ inputs.bot-login }}
        run: |
          # Before the claim: every run has to react as the same account for
          # the reaction to settle which of them answers.
          if [ -n "$APP_TOKEN" ]; then
            echo "GH_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"
            echo "BOT_LOGIN=$APP_SLUG[bot]" >> "$GITHUB_ENV"
          else
            echo "GH_TOKEN=$FALLBACK_TOKEN" >> "$GITHUB_ENV"
            echo "BOT_LOGIN=$FALLBACK_LOGIN" >> "$GITHUB_ENV"
          fi
      - name: Say we have seen it
        id: seen
        env:
          COMMENT: ${{ github.event.comment.id }}
        run: |
          # GitHub answers 201 when it added the reaction and 200 when it was
          # already there, which settles whether this run has anything to do.
          status=$(curl -sS -o "$RUNNER_TEMP/reaction.json" -w '%{http_code}' -X POST \
            -H "authorization: Bearer $GH_TOKEN" \
            -H "accept: application/vnd.github+json" \
            -d '{"content":"eyes"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT/reactions")

          # Everything before this was queueing and provisioning.
          echo "RUN_STARTED=$(date +%s%3N)" >> "$GITHUB_ENV"
          case "$status" in
            201)
              mkdir -p "$RUNNER_TEMP/pending-claims"
              jq --argjson comment "$COMMENT" '{comment: $comment, reaction: .id}' \
                "$RUNNER_TEMP/reaction.json" > "$RUNNER_TEMP/pending-claims/$COMMENT"
              echo "ours=true" >> "$GITHUB_OUTPUT" ;;
            200) echo "another run has this one" ;;
            *)   echo "::error::GitHub said $status to the reaction"; exit 1 ;;
          esac

      - name: Work out where this workflow came from
        id: self
        if: steps.seen.outputs.ours == 'true'
        env:
          # The workflow file defining this job, not the one that called it.
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # The scripts, the agent and the checklist images all come from the
          # commit this workflow came from, including the runtime image.
          if [ -z "$WORKFLOW_SHA" ] || [ -z "$WORKFLOW_REF" ]; then
            echo "::error::job.workflow_ref/workflow_sha are empty; this workflow cannot locate its own scripts"
            exit 1
          fi
          repo="${WORKFLOW_REF%%/.github/*}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "ASSET_REPO=$repo" >> "$GITHUB_ENV"
          echo "ASSET_REF=$WORKFLOW_SHA" >> "$GITHUB_ENV"
          echo "SANDBOX_IMAGE=ghcr.io/$repo/sandbox:$WORKFLOW_SHA" >> "$GITHUB_ENV"

      - name: Check out the agent
        if: steps.seen.outputs.ours == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: |
            bin
            lib
            vendor
            agent
            sandbox
          path: workflow-agent
          persist-credentials: false
      - name: Prepare the matching runtime image
        if: steps.seen.outputs.ours == 'true'
        id: pull
        background: true
        run: |
          if ! docker pull "$SANDBOX_IMAGE"; then
            # A new workflow may run before its image has been published.
            docker build -t "$SANDBOX_IMAGE" workflow-agent/sandbox
          fi
      - name: Resolve the pull request
        if: steps.seen.outputs.ours == 'true'
        id: pr
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: workflow-agent/bin/resolve.ts
      - name: Clone the work tree
        if: steps.seen.outputs.ours == 'true'
        id: worktree
        background: true
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          REF: ${{ steps.pr.outputs.ref }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          # The runner has the credential, so it fetches while the image pulls.
          # `-c` stays on this command; `--config` would land in .git/config.
          #
          # A pull request from a fork has no branch in this repository, so the
          # work tree comes from the pull request's own ref, under the name the
          # branch has where it lives.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          tree="$RUNNER_TEMP/worktree"
          git init -q "$tree"
          git -C "$tree" remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -C "$tree" -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch -q --depth 1 origin "+$REF:refs/heads/$HEAD_REF"
          git -C "$tree" -c checkout.workers=0 checkout -q "$HEAD_REF"

          # What the pull request branched from, so the agent can diff against
          # it. Fetched here because the sandbox has no credential, and before
          # it exists, so nothing of the agent's runs while the runner does.
          if [ -n "$BASE_SHA" ]; then
            git -C "$tree" -c http.extraheader="AUTHORIZATION: basic $auth" \
              fetch -q --depth 1 origin "$BASE_SHA" || echo "could not fetch $BASE_SHA"
          fi

          # The relay leases against the commit the agent started from.
          # Copying is what makes them the same commit.
          cp -a "$tree/.git" "$RUNNER_TEMP/relay.git"

          # The sandbox runs as uid 1000; the runner is somebody else.
          sudo chown -R 1000:1000 "$tree"

      - name: Check out the project's configuration
        if: steps.seen.outputs.ours == 'true'
        id: config
        background: true
        uses: actions/checkout@v7
        with:
          # The default branch, never the pull request head. What this file
          # says decides what runs on the runner.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            ${{ inputs.environments }}
            ${{ inputs.term-llm-config }}
          sparse-checkout-cone-mode: false
          path: project
          persist-credentials: false
      - name: Name the agent
        if: steps.seen.outputs.ours == 'true'
        env:
          GIVEN: ${{ inputs.bot-name }}
        run: |
          echo "BOT_NAME=${GIVEN:-${MENTION#@}}" >> "$GITHUB_ENV"
      - name: Read the model credentials
        if: steps.seen.outputs.ours == 'true'
        env:
          PROVIDER_ENV: ${{ secrets.provider-env }}
        run: workflow-agent/bin/provider-env.ts "$RUNNER_TEMP/provider.env"
      - name: Say we are on it
        if: steps.seen.outputs.ours == 'true'
        id: ack
        env:
          ASKED: ${{ github.event.comment.created_at }}
        run: |
          id=$(workflow-agent/bin/progress.ts start \
                 "Waiting for GitHub to start the workflow" \
                 "Preparing the sandbox" \
                 "Working" \
                 "Replying" \
                 "Waiting ${FOLLOWUP_WINDOW}s for further instructions")
          echo "COMMENT_ID=$id" >> "$GITHUB_ENV"
      - name: Wait for the project's configuration
        wait: [config]
      - name: Read the project's development environments
        if: steps.seen.outputs.ours == 'true'
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          # Later than this, the bot has already said it is working on it.
          workflow-agent/bin/environments.ts \
            "project/$ENVIRONMENTS" "$RUNNER_TEMP/environments.json"
          echo "ENVIRONMENTS_JSON=$RUNNER_TEMP/environments.json" >> "$GITHUB_ENV"
      - name: Wait for the image and the work tree
        wait: [pull, worktree]
      - name: Stand up the host services
        if: steps.seen.outputs.ours == 'true'
        run: workflow-agent/bin/host-setup
      - name: Run the agent
        if: steps.seen.outputs.ours == 'true'
        run: |
          workflow-agent/bin/containers-up.ts
          workflow-agent/bin/converse.ts first
      - name: Answer anything that follows
        if: steps.seen.outputs.ours == 'true'
        run: workflow-agent/bin/converse.ts followups
      - name: Say the run ended early
        if: (failure() || cancelled()) && steps.seen.outputs.ours == 'true'
        env:
          HOW: ${{ job.status }}
        run: |
          [ "$HOW" = failure ] \
            && said="The run failed." \
            || said="The run stopped before it could answer."
          workflow-agent/bin/progress.ts stopped "$said [View the log]($RUN_URL)."

      - name: Release unanswered claims
        if: (failure() || cancelled()) && steps.seen.outputs.ours == 'true'
        run: |
          # Publication removes these records before sending anything to GitHub.
          # Keep claims after an uncertain response to avoid duplicate replies.
          for claim in "$RUNNER_TEMP"/pending-claims/*; do
            [ -f "$claim" ] || continue
            comment=$(jq -r .comment "$claim")
            reaction=$(jq -r .reaction "$claim")
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment/reactions/$reaction"
          done
