name: Probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        id: seen
        run: echo "ours=false" >> "$GITHUB_OUTPUT"

      - name: Skipped background thing
        id: skipped
        if: steps.seen.outputs.ours == 'true'
        background: true
        run: sleep 5

      - name: Wait with a guard
        if: steps.seen.outputs.ours == 'true'
        wait: [skipped]

      - name: Wait without a guard
        wait: [skipped]

      - name: Reached the end
        run: echo "reached the end at $(date +%s)"
