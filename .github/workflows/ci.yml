name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the image's term-llm version
        run: |
          version=$(sed -n 's/^ARG TERM_LLM_VERSION=//p' sandbox/Dockerfile)
          curl -fsSL "https://raw.githubusercontent.com/samsaffron/term-llm/$version/install.sh" \
            | sh -s -- --version "$version"
          echo "TERM_LLM_BINARY=$HOME/.local/bin/term-llm" >> "$GITHUB_ENV"

      - parallel:
          - name: Types
            if: ${{ !cancelled() }}
            run: npm run check

          - name: Tests
            if: ${{ !cancelled() }}
            run: npm test

          - name: ESLint
            if: ${{ !cancelled() }}
            run: npx eslint bin lib test

          - name: Prettier
            if: ${{ !cancelled() }}
            run: npx prettier --check bin lib test eslint.config.mjs

          - name: Shell
            if: ${{ !cancelled() }}
            run: |
              for f in bin/host-setup bin/workspace-start bin/dev-boot bin/dev bin/git-update bin/git-post-receive; do bash -n "$f"; done
              sh -n bin/host-gate
