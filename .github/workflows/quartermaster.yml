name: Quartermaster

on:
  workflow_call:
    inputs:
      mention:
        description: "What people type to summon the agent, including the @."
        required: true
        type: string
      bot-name:
        description: "Name on the agent's commits. Defaults to the mention without its @."
        type: string
        default: ""
      bot-login:
        description: "Login the agent's own comments are posted under."
        type: string
        default: "github-actions[bot]"
      provider:
        description: >-
          Passed to term-llm as `--provider`, so it takes the same forms:
          a provider name, or `name:model`. Leave it unset to use the
          `default_provider` in your own term-llm configuration. Left unset,
          term-llm chooses from the credentials it was given.
        type: string
        default: ""
      term-llm-config:
        description: >-
          Path in this repository to a term-llm configuration for the agent to
          use. Needed for a self-hosted or OpenAI-compatible endpoint, and for
          anything else an environment variable cannot say.
        type: string
        default: ""
      environments:
        description: >-
          Path in this repository to the development environments the agent may
          run commands in. With no such file the agent reads, writes and
          answers, but runs nothing.
        type: string
        default: .github/quartermaster/environments.yml
      trusted-associations:
        description: "Who may instruct the agent, as GitHub author associations."
        type: string
        default: "OWNER,MEMBER,COLLABORATOR"
      followup-window:
        description: "Seconds the sandbox is held open after replying, for a follow-up."
        type: number
        default: 60
      max-comment-age-hours:
        description: "Mentions older than this are left alone, so a backlog is never answered at once."
        type: number
        default: 1
      max-turns:
        type: number
        default: 60
      agent-timeout:
        type: string
        default: "10m"
      runs-on:
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        type: number
        default: 45
    secrets:
      provider-env:
        description: >-
          Lines of `NAME=value` giving the agent's provider what it needs to
          reach a model. Compose it from your own secrets.
        required: true

jobs:
  respond:
    # The caller should carry a condition too: caller-side it costs nothing,
    # and without one every comment in the repository starts a runner. Who may
    # instruct the agent is settled in `next-mention`, which is the only place
    # that can also see the comment it is about to claim.
    if: contains(github.event.comment.body, inputs.mention)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      # One run per issue at a time, queued rather than cancelled. Cancelling
      # would kill a run waiting for a follow-up with the run that follow-up
      # started, which is the one case where waiting was about to pay off.
      # Queueing also means a run cannot start until the one that may have
      # answered its comment has finished, so the mark it leaves is always
      # there to be found.
      group: ${{ inputs.mention }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write  # the relay forwards the agent's commits; its hooks gate the branch
      pull-requests: write
      issues: write

    env:
      MENTION: ${{ inputs.mention }}
      BOT_LOGIN: ${{ inputs.bot-login }}
      TRUSTED_ASSOCIATIONS: ${{ inputs.trusted-associations }}
      FOLLOWUP_WINDOW: ${{ inputs.followup-window }}
      MAX_COMMENT_AGE_HOURS: ${{ inputs.max-comment-age-hours }}
      MAX_TURNS: ${{ inputs.max-turns }}
      AGENT_TIMEOUT: ${{ inputs.agent-timeout }}
      PROGRESS_SCRIPT: ${{ github.workspace }}/quartermaster/src/progress.ts

    steps:
      - name: Say we have seen it
        id: seen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          # Before anything else is fetched: whoever asked should know the
          # mention landed, and this reaction is also the claim on it.
          case ",${{ inputs.trusted-associations }}," in
            *",$ASSOCIATION,"*)
              gh api --method POST \
                "/repos/${{ github.repository }}/issues/comments/$COMMENT/reactions" \
                -f content=eyes --silent
              echo "claimed=$COMMENT" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Work out where this workflow came from
        id: self
        env:
          # The workflow file defining this job, not the one that called it.
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # Scripts, agent and checklist images are all served from the commit
          # this workflow came from, so a caller pinned to a tag gets one
          # matching set and never a mix of two.
          if [ -z "$WORKFLOW_SHA" ] || [ -z "$WORKFLOW_REF" ]; then
            echo "::error::job.workflow_ref/workflow_sha are empty; this workflow cannot locate its own scripts"
            exit 1
          fi
          repo="${WORKFLOW_REF%%/.github/*}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "ASSET_REPO=$repo" >> "$GITHUB_ENV"
          echo "ASSET_REF=$WORKFLOW_SHA" >> "$GITHUB_ENV"

      - name: Check out the agent
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts
            src
            vendor
            agent
          path: quartermaster
          persist-credentials: false

      - name: Name the agent
        run: |
          name='${{ inputs.bot-name }}'
          [ -n "$name" ] || name="${MENTION#@}"
          echo "BOT_NAME=$name" >> "$GITHUB_ENV"

      - name: Read the model credentials
        env:
          PROVIDER_ENV: ${{ secrets.provider-env }}
        run: quartermaster/src/provider-env.ts "$RUNNER_TEMP/provider.env"

      - name: Check out the project's configuration
        uses: actions/checkout@v7
        with:
          # The default branch, never the pull request head. What this says
          # decides what runs on the runner, so a pull request must not be
          # able to choose it.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            ${{ inputs.environments }}
            ${{ inputs.term-llm-config }}
          sparse-checkout-cone-mode: false
          path: project
          persist-credentials: false

      - name: Read the project's development environments
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          # A fault in this file stops the run now. Found later, the bot has
          # already told somebody it is working on their comment.
          quartermaster/src/environments.ts \
            "project/$ENVIRONMENTS" "$RUNNER_TEMP/environments.json"
          echo "ENVIRONMENTS_JSON=$RUNNER_TEMP/environments.json" >> "$GITHUB_ENV"

      - name: Reading pending requests
        id: mine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MENTION_FILE: ${{ runner.temp }}/mention.json
          CLAIMED_ID: ${{ steps.seen.outputs.claimed }}
        run: |
          # Not only the comment that started this run: one run is queued per
          # issue, so a comment displaced from that queue has nothing else
          # looking for it.
          if quartermaster/src/next-mention.ts; then
            echo "mine=true" >> "$GITHUB_OUTPUT"
          else
            echo "everything here has been answered"
          fi
      - name: Say we are on it
        if: steps.mine.outputs.mine == 'true'
        id: ack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          id=$(gh api --method POST \
            "/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="Starting…" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          COMMENT_ID="$id" PROGRESS_FILE="$RUNNER_TEMP/progress.json" \
            quartermaster/src/progress.ts start \
              "Preparing the sandbox" \
              "Working" \
              "Replying" \
              "Waiting ${FOLLOWUP_WINDOW}s for further instructions"

      - name: Resolve the pull request
        if: steps.mine.outputs.mine == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request && 'yes' || 'no' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: quartermaster/src/resolve.ts

      - name: Fetch the branch
        if: steps.mine.outputs.mine == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          # Only the sandbox ever reads a work tree, and it clones one for
          # itself, so nothing here writes the files out.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git init -q --bare "$RUNNER_TEMP/relay.git"
          git --git-dir="$RUNNER_TEMP/relay.git" \
            -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" \
            "+${{ steps.pr.outputs.ref }}:refs/heads/$HEAD_REF"

      - name: Stand up the host services
        if: steps.mine.outputs.mine == 'true'
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          CAN_PUSH: ${{ steps.pr.outputs.can_push }}
          PUSH_BLOCKED_BECAUSE: ${{ steps.pr.outputs.reason }}
          COMMENT_ID: ${{ steps.ack.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOOLSETS: pull_requests,issues
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: quartermaster/scripts/host-setup

      - name: Run the agent
        if: steps.mine.outputs.mine == 'true'
        env:
          MENTION_FILE: ${{ runner.temp }}/mention.json
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request && 'yes' || 'no' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          CAN_PUSH: ${{ steps.pr.outputs.can_push }}
          PUSH_BLOCKED_BECAUSE: ${{ steps.pr.outputs.reason }}
          SANDBOX_IMAGE: ghcr.io/${{ steps.self.outputs.repo }}/sandbox:${{ steps.self.outputs.sha }}
          AGENT_DIR: ${{ github.workspace }}/quartermaster/agent
          SKILLS_DIR: ${{ github.workspace }}/quartermaster/agent/skills
          MCP_TEMPLATE: ${{ github.workspace }}/quartermaster/agent/mcp.json
          PROVIDER: ${{ inputs.provider }}
          TERM_LLM_CONFIG: ${{ inputs.term-llm-config && format('{0}/project/{1}', github.workspace, inputs.term-llm-config) || '' }}
          COMMENT_ID: ${{ steps.ack.outputs.id }}
          PROGRESS_FILE: ${{ runner.temp }}/progress.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          quartermaster/scripts/sandbox-up
          quartermaster/src/converse.ts

      - name: Post what a failed run left behind
        if: failure() && steps.mine.outputs.mine == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: quartermaster/src/post-review.ts || true

      - name: Show what happened behind the gate
        if: failure() && steps.mine.outputs.mine == 'true'
        run: cat "$RUNNER_TEMP/dev-up.log" 2>/dev/null || echo "the development environment was never asked for"

      - name: Note that a newer mention took over
        if: cancelled() && steps.mine.outputs.mine == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.ack.outputs.id }}" \
            -f body="Superseded by a newer mention." >/dev/null

      - name: Report failure
        if: failure() && steps.mine.outputs.mine == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method PATCH \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.ack.outputs.id }}" \
            -f body="The run failed. [View the log]($RUN_URL)." >/dev/null
